services:
  gpt-image-playground:
    image: ghcr.io/YOUR_GITHUB_USERNAME/gpt_image_playground:latest
    container_name: gpt-image-playground-fork
    ports:
      - "10086:80"
    environment:
      - DEFAULT_API_URL=https://api.openai.com/v1
      # 可选：如果使用自定义中转 API，填入中转地址（例如 https://ai.akile.ai/v1）
      # - API_PROXY_URL=https://ai.akile.ai/v1
      # 是否开启中转 API 代理服务（true/false）
      # - ENABLE_API_PROXY=true
    restart: unless-stopped
